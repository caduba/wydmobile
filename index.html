<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fila Nemesis</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0f172a;
      color: #e5e7eb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .top-bar {
      width: 100%;
      padding: 20px;
      display: flex;
      justify-content: center;
      gap: 15px;
      background: #020617;
      border-bottom: 1px solid #1e293b;
    }

    .btn-add {
      background: #38bdf8;
      color: #020617;
      border: none;
      padding: 12px 25px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }

    /* Admin */
    #adminBtn {
      background: #fbbf24;
      display: none;
    }

    .container {
      max-width: 1000px;
      width: 100%;
      margin-top: 40px;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 25px;
    }

    .item-card {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 20px;
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .item-card img {
      width: 90px;
      height: 90px;
      object-fit: contain;
      border-radius: 8px;
      border: 2px solid #38bdf8;
      padding: 4px;
      background: #020617;
    }

    .item-info {
      flex: 1;
    }

    .item-info h3 {
      color: #38bdf8;
      margin-bottom: 8px;
    }

    .queue {
      list-style: none;
    }

    .queue li {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 5px 8px;
      margin-bottom: 5px;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      cursor: pointer;
    }

    .queue li:hover {
      background: #020b2f;
    }

    .pos {
      color: #38bdf8;
      font-weight: bold;
    }

    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 30px;
      width: 90%;
      max-width: 400px;
    }

    .modal-content h3 {
      text-align: center;
      margin-bottom: 20px;
      color: #38bdf8;
    }

    .modal-content input,
    .modal-content select {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: none;
      margin-bottom: 10px;
    }

    .modal-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }

    .btn-confirm {
      background: #22c55e;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-cancel {
      background: #ef4444;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

  </style>
</head>
<body>

  <div class="top-bar">
    <button class="btn-add" onclick="openModal()">Join Queue</button>

    <button class="btn-add" id="adminBtn" onclick="loginAdmin()">
      Admin
    </button>
  </div>

  <div class="container">

    <!-- ITENS -->
    <script>
      const items = [
        ["Archangel Weapon Chest","https://i.imgur.com/DYOzqgO.png"],
        ["Flame of Condor","https://i.imgur.com/J33pboh.png"],
        ["Feather of Condor","https://i.imgur.com/IuOPsM8.png"],
        ["Awakening Jewel","https://i.imgur.com/aKfcUo4.png"],
        ["Crystal of Chaos","https://i.imgur.com/SExCYGi.png"],
        ["Jewel of Creation","https://i.imgur.com/EfOrY5K.png"],
        ["Ultimate War Soul","https://i.imgur.com/Jik7e09.png"]
      ];

      items.forEach((item,i)=>{
        document.write(`
        <div class="item-card">
          <img src="${item[1]}">
          <div class="item-info">
            <h3>${item[0]}</h3>
            <ul class="queue" id="queue${i+1}"></ul>
          </div>
        </div>
        `);
      });
    </script>

  </div>

  <!-- Modal -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <h3>Join Queue</h3>

      <label>Nick</label>
      <input type="text" id="nick">

      <label>Item</label>
      <select id="item"></select>

      <div class="modal-buttons">
        <button class="btn-confirm" onclick="addPlayer()">Confirm</button>
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script>

const firebaseConfig = {
  apiKey: "AIzaSyA1XKYKTrRilVClsyqqBWJzTFdBIGe5o10",
  authDomain: "queue-nemesis.firebaseapp.com",
  databaseURL: "https://queue-nemesis-default-rtdb.firebaseio.com",
  projectId: "queue-nemesis",
  storageBucket: "queue-nemesis.firebasestorage.app",
  messagingSenderId: "609915442047",
  appId: "1:609915442047:web:ce5678f84aa3d135ea404a"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

let isAdmin = false;

/* Detecta admin pelo link */
document.addEventListener("DOMContentLoaded", ()=>{

  const params = new URLSearchParams(window.location.search);

  if(params.get("admin")==="nem26"){
    document.getElementById("adminBtn").style.display="inline-block";
  }

  const sel = document.getElementById("item");

  items.forEach((item,i)=>{
    sel.innerHTML += `<option value="${i+1}">${item[0]}</option>`;
  });

});

function loginAdmin(){

  const pass = prompt("Senha Admin:");

  if(pass==="nem26"){
    isAdmin = true;
    alert("Admin ativado");
  }else{
    alert("Senha incorreta");
  }

}

function openModal(){
  document.getElementById("modal").style.display="flex";
}

function closeModal(){
  document.getElementById("modal").style.display="none";
  document.getElementById("nick").value="";
}

function addPlayer(){

  const nick = document.getElementById("nick").value.trim();
  const item = document.getElementById("item").value;

  if(!nick) return alert("Digite o nick");

  db.ref("queues/item"+item).push(nick);

  closeModal();
}

function listenQueues(){

  for(let i=1;i<=7;i++){

    const ref = db.ref("queues/item"+i);

    ref.on("value", snap=>{

      const ul = document.getElementById("queue"+i);

      ul.innerHTML="";

      const data = snap.val();

      if(!data){
        ul.innerHTML="<li><span class='pos'>1º</span><span>Vazio</span></li>";
        return;
      }

      let pos=1;

      for(let key in data){

        const li=document.createElement("li");

        li.innerHTML=`<span class='pos'>${pos}º</span><span>${data[key]}</span>`;

        if(isAdmin){

          li.onclick=()=>{

            if(confirm("Remover "+data[key]+"?")){
              ref.child(key).remove();
            }

          };

        }

        ul.appendChild(li);
        pos++;

      }

    });

  }

}

listenQueues();

  </script>

</body>
</html>
